name: Build IronTime

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true
      - name: Test
        run: flutter test
        continue-on-error: true
      - name: Build split APKs
        run: flutter build apk --release --split-per-abi
      - name: Rename APKs
        run: cd build/app/outputs/flutter-apk && mv app-arm64-v8a-release.apk IronTime-arm64-v8a.apk && mv app-armeabi-v7a-release.apk IronTime-armeabi-v7a.apk && mv app-x86_64-release.apk IronTime-x86_64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: irontime-apks
          path: build/app/outputs/flutter-apk/IronTime-*.apk
          if-no-files-found: error
